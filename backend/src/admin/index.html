<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区AI管理后台</title>
  <style>
    :root{--nav:#15243e;--blue:#2563eb;--line:#e2e8f0;--muted:#64748b;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.65}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#dbeafe,transparent 38%),var(--bg)}.login-card{width:min(420px,calc(100% - 32px));padding:34px;border-radius:18px;background:white;box-shadow:0 22px 55px #1020441c}.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:700;margin-bottom:26px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--blue);color:white}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:8px;background:white}.primary{border:0;border-radius:8px;padding:11px 14px;color:white;background:var(--blue)}.danger{border:1px solid #fecaca;color:#b91c1c;background:#fff}.ghost{border:1px solid #cbd5e1;color:#334155;background:white}.small{padding:6px 9px;border-radius:6px;font-size:12px}.hint,.empty{color:var(--muted);font-size:13px}.error{min-height:20px;color:#dc2626;margin-top:12px}.shell{min-height:100vh;display:flex}.sidebar{width:228px;flex:0 0 228px;padding:19px 12px;color:#b7c4d9;background:var(--nav)}.sidebar .brand{padding:0 8px;color:white;font-size:16px}.sidebar .mark{width:26px;height:26px;font-size:13px}.nav{width:100%;border:0;border-radius:7px;padding:10px 11px;margin:3px 0;color:inherit;text-align:left;background:transparent}.nav.active,.nav:hover{color:white;background:#294875}.logout{margin:22px 8px 0;color:#dbeafe;background:transparent;border:0}.content{width:100%;max-width:1400px;margin:0 auto;padding:34px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:6px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat,.panel{border:1px solid var(--line);border-radius:12px;background:white}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:28px;margin-top:9px}.panel{padding:18px;margin-top:16px}.panel h2{margin:0;font-size:17px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:15px 0}.toolbar input,.toolbar select{padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white}.toolbar .left{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:middle}th{color:var(--muted);font-weight:500;font-size:12px}td.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px}.on{color:#166534;background:#dcfce7}.off{color:#b45309;background:#fef3c7}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#0f172a80}.modal-card{width:min(610px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:23px;border-radius:13px;background:white}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .wide{grid-column:1/-1}.provider-test-result{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;line-height:1.65}.provider-test-result.success{color:#166534;background:#f0fdf4;border-color:#bbf7d0}.provider-test-result.failure{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.provider-test-result strong{display:block;margin-bottom:2px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.pagination{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;border-radius:8px;color:white;background:#0f766e;box-shadow:0 8px 24px #0f172a33}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.log-detail{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:850px){.sidebar{width:64px;flex-basis:64px;padding:16px 7px}.sidebar .brand span,.nav span,.logout span{display:none}.sidebar .brand{padding:0;justify-content:center}.nav{text-align:center}.content{padding:22px 14px}.stats{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}@media(max-width:540px){.stats{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar .left{flex-direction:column}.toolbar input{width:100%}}
  </style>
</head>
<body>
  <section id="login" class="login"><form id="loginForm" class="login-card"><div class="brand"><i class="mark">AI</i>社区AI管理后台</div><p class="hint">仅超级管理员可以登录和管理账号及大模型服务。</p><label class="field">手机号<input id="phone" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" style="width:100%">安全登录</button><div id="loginError" class="error"></div></form></section>
  <section id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><i class="mark">AI</i><span>社区AI后台</span></div><nav id="nav"><button class="nav active" data-page="overview">▦ <span>数据总览</span></button><button class="nav" data-page="users">♙ <span>账号管理</span></button><button class="nav" data-page="security">⌑ <span>账户安全</span></button><button class="nav" data-page="providers">◇ <span>模型管理</span></button><button class="nav" data-page="usage">◴ <span>调用用量</span></button><button class="nav" data-page="versions">⇧ <span>版本发布</span></button><button class="nav" data-page="logs">☷ <span>操作日志</span></button></nav><button id="logout" class="logout">↪ <span>退出登录</span></button></aside><main id="content" class="content"></main></section>
  <div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"></div></div><div id="toast" class="toast hidden"></div>
  <script>
    const state={token:localStorage.getItem('community-ai-admin-token')||'',page:'overview',usersPage:1};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function api(path,options={}){const headers={...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch('/api'+path,{...options,headers});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'请求失败');return data}
    function toast(message,error=false){const node=$('#toast');node.textContent=message;node.style.background=error?'#b91c1c':'#0f766e';node.classList.remove('hidden');setTimeout(()=>node.classList.add('hidden'),2600)}
    function date(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}function badge(value,onText='正常',offText='已停用'){return `<span class="badge ${value?'on':'off'}">${value?onText:offText}</span>`}
    function setContent(title,subtitle,body,action=''){ $('#content').innerHTML=`<header class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</header>${body}`;bindDynamicActions()}
    function closeModal(){ $('#modal').classList.add('hidden');$('#modalCard').innerHTML='' }function modal(html){$('#modalCard').innerHTML=html;bindDynamicActions();$('#modal').classList.remove('hidden')} $('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#initialPasswordForm'))closeModal()});
    function bindDynamicActions(){document.querySelectorAll('#content [onclick],#modalCard [onclick]').forEach(button=>{const legacy=button.getAttribute('onclick'),match=legacy.match(/^window\.(editUser|resetPassword|unlockLogin|toggleUser|deleteUser|testSavedProvider|editProvider|toggleProvider|deleteProvider)\('([^']+)'(?:,(true|false))?\)$/);if(legacy==='closeModal()'){button.removeAttribute('onclick');button.addEventListener('click',closeModal);return}if(legacy==='render()'){button.removeAttribute('onclick');button.addEventListener('click',render);return}if(!match)return;const[,action,id,next]=match;button.removeAttribute('onclick');button.addEventListener('click',async()=>{try{if(action==='editUser')await window.editUser(id);else if(action==='resetPassword')await window.resetPassword(id);else if(action==='unlockLogin')await window.unlockLogin(id);else if(action==='toggleUser')await window.toggleUser(id,next==='true');else if(action==='deleteUser')await window.deleteUser(id);else if(action==='testSavedProvider')await window.testSavedProvider(id);else if(action==='editProvider')await window.editProvider(id);else if(action==='toggleProvider')await window.toggleProvider(id,next==='true');else if(action==='deleteProvider')await window.deleteProvider(id)}catch(error){toast(error.message||'操作失败',true)}})})}
    async function overview(){
      const d=await api('/admin/overview');
      setContent('数据总览','掌握账号、模型服务与近 30 天调用情况。',`<div class="stats"><div class="stat"><span>注册账号</span><b>${d.metrics.registeredUsers}</b></div><div class="stat"><span>启用账号</span><b>${d.metrics.activeUsers}</b></div><div class="stat"><span>近 30 天调用</span><b>${d.metrics.callsLast30Days}</b></div><div class="stat"><span>可用模型服务</span><b>${d.metrics.activeProviders}</b></div></div><section class="panel"><h2>近期注册账号</h2><table><thead><tr><th>手机号</th><th>账号类型</th><th>状态</th><th>注册时间</th></tr></thead><tbody>${d.recentUsers.length?d.recentUsers.map(u=>`<tr><td>${esc(u.phone)}</td><td>${u.role==='member'?'子账号':u.role==='main_account'||u.role==='unit_admin'?'主账号':'平台管理员'}</td><td>${badge(u.isActive)}</td><td>${date(u.createdAt)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">暂未注册账号</td></tr>'}</tbody></table></section>`);
    }
    async function users(){
      const keyword=state.keyword||'',active=state.active||'';
      const d=await api(`/auth/users?keyword=${encodeURIComponent(keyword)}&isActive=${active}&page=${state.usersPage}&pageSize=15`);
      const actions=u=>u.isDeleted?'<span class="hint">已安全删除</span>':u.role==='admin'||u.role==='platform_admin'?'<span class="hint">平台管理员</span>':`${u.role==='member'?'':`<button class="ghost small" onclick="window.editUser('${u.id}')">授权</button>`}<button class="ghost small" onclick="window.resetPassword('${u.id}')">重置密码</button>${u.loginLockedUntil&&new Date(u.loginLockedUntil)>new Date()?`<button class="ghost small" onclick="window.unlockLogin('${u.id}')">解除登录锁定</button>`:''}<button class="${u.isActive?'danger':'primary'} small" onclick="window.toggleUser('${u.id}',${!u.isActive})">${u.isActive?'停用':'启用'}</button><button class="danger small" onclick="window.deleteUser('${u.id}')">删除</button>`;
      const rows=d.users.map(u=>`<tr><td>${esc(u.phone)}</td><td>${u.role==='member'?'子账号':u.role==='main_account'||u.role==='unit_admin'?'主账号':'平台管理员'}</td><td>${u.role==='member'?'随主账号':u.planType==='permanent'?'永久':u.planType==='trial'?'试用':'限期'}${u.role==='member'||!u.planExpiresAt?'':' · '+new Date(u.planExpiresAt).toLocaleDateString('zh-CN')}</td><td>${u.isDeleted?'<span class="badge off">已删除</span>':badge(u.isActive)}</td><td>${date(u.createdAt)}</td><td class="actions">${actions(u)}</td></tr>`).join('');
      setContent('账号管理','按手机号管理主账号；子账号的期限与主账号一致。',`<section class="panel"><div class="toolbar"><div class="left"><input id="userSearch" value="${esc(keyword)}" placeholder="搜索手机号"><select id="userActive"><option value="">全部状态</option><option value="true" ${active==='true'?'selected':''}>正常</option><option value="false" ${active==='false'?'selected':''}>已停用 / 已删除</option></select><button id="searchUsers" class="ghost small">搜索</button></div><span class="hint">共 ${d.pagination.total} 个账号</span></div><table><thead><tr><th>手机号</th><th>类型</th><th>授权</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">没有符合条件的账号</td></tr>'}</tbody></table><div class="pagination"><button id="prevUsers" class="ghost small" ${d.pagination.page<=1?'disabled':''}>上一页</button><span class="hint">第 ${d.pagination.page} / ${d.pagination.totalPages} 页</span><button id="nextUsers" class="ghost small" ${d.pagination.page>=d.pagination.totalPages?'disabled':''}>下一页</button></div></section>`);
      $('#searchUsers').onclick=()=>{state.keyword=$('#userSearch').value;state.active=$('#userActive').value;state.usersPage=1;users()};
      $('#prevUsers').onclick=()=>{state.usersPage--;users()};
      $('#nextUsers').onclick=()=>{state.usersPage++;users()};
    }
    window.editUser=async id=>{const {user}=await api('/auth/users/'+id);modal(`<div class="modal-head"><h2>调整账号授权</h2><button class="ghost small" onclick="closeModal()">关闭</button></div><form id="entitlementForm"><label class="field">手机号<input value="${esc(user.phone)}" disabled></label><label class="field">授权类型<select id="planType"><option value="trial" ${user.planType==='trial'?'selected':''}>试用</option><option value="expires" ${user.planType==='expires'?'selected':''}>限期授权</option><option value="permanent" ${user.planType==='permanent'?'selected':''}>永久授权</option></select></label><label class="field">到期时间（限期授权必填）<input id="planExpiresAt" type="datetime-local" value="${user.planExpiresAt?new Date(user.planExpiresAt).toISOString().slice(0,16):''}"></label><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">保存</button></div></form>`);$('#entitlementForm').onsubmit=async e=>{e.preventDefault();const planType=$('#planType').value,raw=$('#planExpiresAt').value;if(planType==='expires'&&!raw)return toast('限期授权需要到期时间',true);await api('/auth/users/'+id+'/entitlement',{method:'PUT',body:JSON.stringify({planType,planExpiresAt:planType==='permanent'?null:raw?new Date(raw).toISOString():null})});closeModal();toast('授权已更新');users()}}
    window.unlockLogin=async id=>{await api('/auth/users/'+id+'/unlock-login',{method:'POST'});toast('登录锁定已解除');users()};window.resetPassword=async id=>{const password=prompt('输入新的登录密码（至少 6 位）：');if(password===null)return;if(password.length<6)return toast('密码至少需要 6 位',true);await api('/auth/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({newPassword:password})});toast('密码已重置，旧会话已失效')};window.toggleUser=async(id,next)=>{if(!confirm(next?'确认启用该账号？':'确认停用该账号？'))return;await api('/auth/users/'+id+'/entitlement',{method:'PUT',body:JSON.stringify({isActive:next})});toast(next?'账号已启用':'账号已停用，旧会话已失效');users()};window.deleteUser=async id=>{if(!confirm('确认删除此账号吗？删除后不能登录，手机号会释放并可重新注册；主账号删除后，其子账号也会停用。'))return;await api('/auth/users/'+id,{method:'DELETE'});toast('账号已安全删除，手机号可重新注册');users()}
    async function security(){setContent('账户安全','修改密码后，当前和其他设备上的旧登录会话都会立即失效。',`<section class="panel"><form id="passwordForm" class="form-grid"><label class="field">当前密码<input id="oldPassword" type="password" autocomplete="current-password" required></label><label class="field">新密码<input id="newPassword" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">确认新密码<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></label><div class="form-actions"><button class="primary">修改密码并重新登录</button></div></form></section>`);$('#passwordForm').onsubmit=async e=>{e.preventDefault();const oldPassword=$('#oldPassword').value,newPassword=$('#newPassword').value;if(newPassword!==$('#confirmPassword').value)return toast('两次输入的新密码不一致',true);await api('/auth/password',{method:'PUT',body:JSON.stringify({oldPassword,newPassword})});toast('密码已修改，请使用新密码重新登录');setTimeout(logout,700)}}
    async function providers(){const d=await api('/ai/providers');setContent('模型管理','配置任意 OpenAI 兼容的在线大模型 API，密钥不会在页面显示。',`<section class="panel"><div class="toolbar"><span class="hint">已配置 ${d.providers.length} 个服务</span><button id="newProvider" class="primary small">新增模型服务</button></div><table><thead><tr><th>服务</th><th>默认模型</th><th>图片理解</th><th>API 地址</th><th>密钥</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.providers.length?d.providers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.defaultModel)}</td><td>${p.supportsVision?`已启用 · ${esc(p.visionModel||'未填模型')}`:'未启用'}</td><td class="log-detail" title="${esc(p.baseUrl)}">${esc(p.baseUrl)}</td><td>${p.hasApiKey?'已配置':'未配置'}</td><td>${badge(p.isActive,'启用','停用')}</td><td class="actions"><button class="ghost small" onclick="window.testSavedProvider('${p.id}')">测试连接</button><button class="ghost small" onclick="window.editProvider('${p.id}')">编辑</button><button class="${p.isActive?'danger':'primary'} small" onclick="window.toggleProvider('${p.id}',${!p.isActive})">${p.isActive?'停用':'启用'}</button><button class="danger small" onclick="window.deleteProvider('${p.id}')">删除</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">暂未配置模型服务</td></tr>'}</tbody></table></section>`,'');$('#newProvider').onclick=()=>providerForm()}
    function providerForm(provider={}){
      modal(`<div class="modal-head"><h2>${provider.id?'编辑':'新增'}模型服务</h2><button class="ghost small" onclick="closeModal()">关闭</button></div><form id="providerForm"><div class="form-grid"><label class="field">服务名称<input id="providerName" value="${esc(provider.name||'')}" required placeholder="例如 DeepSeek"></label><label class="field">服务类型<input id="providerType" value="${esc(provider.providerType||'openai-compatible')}" placeholder="openai-compatible"></label><label class="field wide">API 基础地址<input id="baseUrl" value="${esc(provider.baseUrl||'')}" required placeholder="https://api.deepseek.com"></label><label class="field wide">${provider.id?'新 API 密钥（留空则不修改）':'API 密钥'}<input id="apiKey" type="password" ${provider.id?'':'required'}></label><label class="field">默认模型<input id="defaultModel" value="${esc(provider.defaultModel||'')}" required placeholder="例如 deepseek-v4-flash"></label><label class="field">可用模型（逗号分隔）<input id="availableModels" value="${esc((provider.availableModels||[]).join(','))}" required placeholder="deepseek-v4-flash,deepseek-v4-pro"></label><label class="field"><span>图片理解能力</span><span><input id="supportsVision" type="checkbox" ${provider.supportsVision?'checked':''}> 支持查看并理解图片</span></label><label class="field">视觉模型<input id="visionModel" value="${esc(provider.visionModel||'')}" placeholder="例如支持图片的模型名称"></label></div><p class="hint">DeepSeek 推荐地址：https://api.deepseek.com；API 密钥只保存在后端。</p><div id="providerTestResult" class="provider-test-result hidden" role="status"></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">取消</button><button type="button" id="testProvider" class="ghost">测试文字</button><button type="button" id="testVisionProvider" class="ghost">测试图片</button><button class="primary">保存</button></div></form>`);
      const form=$('#providerForm'),testButton=$('#testProvider'),visionTestButton=$('#testVisionProvider'),result=$('#providerTestResult');
      const formBody=()=>({providerId:provider.id||undefined,name:$('#providerName').value.trim(),providerType:$('#providerType').value.trim(),baseUrl:$('#baseUrl').value.trim(),apiKey:$('#apiKey').value,defaultModel:$('#defaultModel').value.trim(),availableModels:$('#availableModels').value.split(',').map(x=>x.trim()).filter(Boolean),supportsVision:$('#supportsVision').checked,visionModel:$('#visionModel').value.trim()});
      testButton.onclick=async()=>{
        if(!form.reportValidity())return;
        testButton.disabled=true;testButton.textContent='正在测试…';result.className='provider-test-result';result.textContent='后端正在连接模型服务，请稍候…';
        try{const tested=await api('/ai/providers/test',{method:'POST',body:JSON.stringify(formBody())});result.className='provider-test-result success';result.innerHTML=`<strong>连接成功</strong><div>模型：${esc(tested.model||'—')}　耗时：${Number(tested.latencyMs||0).toLocaleString('zh-CN')} 毫秒　Token：${Number(tested.totalTokens||0).toLocaleString('zh-CN')}</div><div>模型回复：${esc(tested.reply||'—')}</div>`}
        catch(error){result.className='provider-test-result failure';result.textContent=`测试失败：${error.message||'请检查配置后重试'}`}
        finally{testButton.disabled=false;testButton.textContent='测试连接'}
      };
      visionTestButton.onclick=async()=>{
        if(!form.reportValidity())return;if(!$('#supportsVision').checked)return toast('请先勾选支持图片理解',true);
        visionTestButton.disabled=true;visionTestButton.textContent='正在测试图片…';result.className='provider-test-result';result.textContent='正在发送一张测试图片验证模型能力…';
        try{const tested=await api('/ai/providers/test',{method:'POST',body:JSON.stringify({...formBody(),testVision:true})});result.className='provider-test-result success';result.innerHTML=`<strong>图片理解测试成功</strong><div>模型：${esc(tested.model||'—')}　耗时：${Number(tested.latencyMs||0).toLocaleString('zh-CN')} 毫秒</div><div>模型回复：${esc(tested.reply||'—')}</div>`}
        catch(error){result.className='provider-test-result failure';result.textContent=`图片测试失败：${error.message||'请确认该模型支持图片输入'}`}
        finally{visionTestButton.disabled=false;visionTestButton.textContent='测试图片'}
      };
      form.onsubmit=async e=>{e.preventDefault();const body=formBody();delete body.providerId;if(provider.id)await api('/ai/providers/'+provider.id,{method:'PUT',body:JSON.stringify(body)});else await api('/ai/providers',{method:'POST',body:JSON.stringify(body)});closeModal();toast('模型服务已保存');providers()}
    }
    window.testSavedProvider=async id=>{const all=await api('/ai/providers'),provider=all.providers.find(item=>item.id===id);if(!provider)throw new Error('模型服务不存在');modal(`<div class="modal-head"><h2>测试 ${esc(provider.name)}</h2><button class="ghost small" onclick="closeModal()">关闭</button></div><div id="savedProviderTestResult" class="provider-test-result" role="status">后端正在连接模型服务，请稍候…</div>`);const result=$('#savedProviderTestResult');try{const tested=await api('/ai/providers/test',{method:'POST',body:JSON.stringify({providerId:id})});result.className='provider-test-result success';result.innerHTML=`<strong>连接成功</strong><div>模型：${esc(tested.model||'—')}　耗时：${Number(tested.latencyMs||0).toLocaleString('zh-CN')} 毫秒　Token：${Number(tested.totalTokens||0).toLocaleString('zh-CN')}</div><div>模型回复：${esc(tested.reply||'—')}</div>`}catch(error){result.className='provider-test-result failure';result.textContent=`测试失败：${error.message||'请检查配置后重试'}`}}
    window.editProvider=async id=>{const all=await api('/ai/providers');providerForm(all.providers.find(p=>p.id===id))};window.toggleProvider=async(id,next)=>{await api('/ai/providers/'+id,{method:'PUT',body:JSON.stringify({isActive:next})});toast(next?'模型服务已启用':'模型服务已停用');providers()};window.deleteProvider=async id=>{if(!confirm('确认删除这个模型服务吗？'))return;await api('/ai/providers/'+id,{method:'DELETE'});toast('模型服务已删除');providers()}
    async function usage(){const d=await api('/ai/usage/all?days=30');setContent('调用用量','近 30 天所有账号调用的汇总数据。',`<div class="stats"><div class="stat"><span>调用次数</span><b>${d.stats.total_calls}</b></div><div class="stat"><span>总 Token</span><b>${d.stats.total_tokens}</b></div><div class="stat"><span>平均延迟</span><b>${d.stats.avg_latency} ms</b></div><div class="stat"><span>失败调用</span><b>${d.stats.error_count}</b></div></div><section class="panel"><h2>按模型统计</h2><table><thead><tr><th>模型</th><th>调用次数</th><th>Token</th></tr></thead><tbody>${d.stats.byModel.length?d.stats.byModel.map(x=>`<tr><td>${esc(x.model)}</td><td>${x.calls}</td><td>${x.tokens}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">暂无调用记录</td></tr>'}</tbody></table></section>`)}
    async function versions(){const d=await api('/update/versions');setContent('版本发布','查看已发布的软件版本。可在后端 API 中继续上传与下架版本。',`<section class="panel"><table><thead><tr><th>版本</th><th>平台</th><th>渠道</th><th>下载次数</th><th>状态</th><th>发布时间</th></tr></thead><tbody>${d.versions.length?d.versions.map(v=>`<tr><td>${esc(v.version)}</td><td>${esc(v.platform)}</td><td>${esc(v.channel)}</td><td>${v.downloadCount}</td><td>${badge(v.isActive,'已发布','已下架')}</td><td>${date(v.createdAt)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无已发布版本</td></tr>'}</tbody></table></section>`)}
    async function logs(){const d=await api('/auth/audit-logs');setContent('操作日志','最多展示最近 500 条账号、模型和授权相关的管理操作。',`<section class="panel"><table><thead><tr><th>时间</th><th>操作</th><th>目标</th><th>详情</th><th>来源</th></tr></thead><tbody>${d.logs.length?d.logs.map(l=>`<tr><td>${date(l.created_at)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td><td class="log-detail" title="${esc(l.detail)}">${esc(l.detail||'—')}</td><td>${esc(l.ip_address||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无操作记录</td></tr>'}</tbody></table></section>`)}
    const renderers={overview,users,security,providers,usage,versions,logs};async function render(){try{await renderers[state.page]()}catch(e){if(/认证令牌|管理员权限|无效或已过期|登录已失效/.test(e.message)){logout();return}setContent('加载失败','请检查后端服务状态。',`<section class="panel"><p class="error">${esc(e.message)}</p><button class="primary" onclick="render()">重试</button></section>`)} }window.render=render;function logout(){state.token='';localStorage.removeItem('community-ai-admin-token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}window.closeModal=closeModal;
    function showInitialPasswordChange(){modal('<div class="modal-head"><h2>首次登录，请修改初始密码</h2></div><form id="initialPasswordForm"><p class="hint">修改密码后才能使用管理后台。</p><label class="field">初始密码<input id="initialOldPassword" type="password" autocomplete="current-password" required></label><label class="field">新密码<input id="initialNewPassword" type="password" autocomplete="new-password" minlength="6" required></label><p id="initialPasswordError" class="error"></p><button class="primary">修改密码</button></form>');$('#initialPasswordForm').onsubmit=async e=>{e.preventDefault();try{await api('/auth/password',{method:'PUT',body:JSON.stringify({oldPassword:$('#initialOldPassword').value,newPassword:$('#initialNewPassword').value})});closeModal();logout();toast('密码已修改，请重新登录')}catch(error){$('#initialPasswordError').textContent=error.message}}}
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('#phone').value,password:$('#password').value})});if(d.user.role!=='admin')throw new Error('该账号没有管理员权限');state.token=d.token;localStorage.setItem('community-ai-admin-token',state.token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(d.user.mustChangePassword)showInitialPasswordChange();else render()}catch(err){$('#loginError').textContent=err.message}};$('#nav').onclick=e=>{const btn=e.target.closest('[data-page]');if(!btn)return;state.page=btn.dataset.page;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===btn));render()};$('#logout').onclick=logout;if(state.token){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');api('/auth/profile').then(({user})=>user.mustChangePassword?showInitialPasswordChange():render()).catch(()=>logout())}
  </script>
<script src="ai-quota-management.js"></script>
<script src="ai-model-management.js"></script>
<script src="ai-credit-policy-ui.js"></script>
